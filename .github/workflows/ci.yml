name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r backend/requirements-dev.txt
      - name: Run tests
        run: pytest

  build-frontend:
    # Catch a broken React build here, before the deploy step ever runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install + build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    # Only deploy after tests + frontend build pass, and only on a push to main.
    needs: [test, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
      - name: Deploy to EC2
        env:
          SSH: ssh -i ~/.ssh/key -o StrictHostKeyChecking=accept-new
          HOST: ec2-user@${{ secrets.EC2_HOST }}
        run: |
          # Sync source to the server (preserve the server-side .env + data).
          rsync -az --delete \
            --exclude '.venv' --exclude 'node_modules' --exclude 'dist' \
            --exclude '*.db' --exclude '.git' --exclude '__pycache__' \
            --exclude '.env' --exclude '.github' \
            -e "$SSH" ./ "$HOST":/home/ec2-user/vocabio/
          # Rebuild + restart with the production (Caddy/HTTPS) overlay.
          $SSH "$HOST" \
            'cd /home/ec2-user/vocabio && sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build'
